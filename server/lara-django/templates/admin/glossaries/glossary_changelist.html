{% extends "admin/change_list.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<style>
    .refresh-lara-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background-color: #417690;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        transition: background-color 0.2s;
    }

    .refresh-lara-btn:hover {
        background-color: #2e5568;
        color: white;
    }

    .refresh-lara-btn i {
        font-size: 16px;
    }
</style>
{% endblock %}

{% block object-tools %}
<ul class="object-tools">
    <li>
        <a href="{% url 'glossaries_refresh_form' %}" class="refresh-lara-btn">
            <i class="ph-arrows-clockwise"></i>
            <span>Refresh from Lara</span>
        </a>
    </li>
    {{ block.super }}
</ul>
{% endblock %}
