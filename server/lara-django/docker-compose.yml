services:
  postgres:
    image: postgres:15-alpine
    container_name: lara_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lara_db}
      POSTGRES_USER: ${POSTGRES_USER:-lara_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lara_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_data:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    networks:
      - lara_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lara_user} -d ${POSTGRES_DB:-lara_db} && psql -U ${POSTGRES_USER:-lara_user} -d ${POSTGRES_DB:-lara_db} -c 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: lara_redis
    ports:
      - "6379:6379"
    networks:
      - lara_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lara_django
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8001 --workers 4 --timeout 300
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lara_network
      - lexamt-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/lara-django/health/"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lara_celery
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lara_network

volumes:
  postgres_data:

networks:
  lara_network:
    driver: bridge
  lexamt-network:
    external: true
