# Configuration Nginx pour le CLIENT
# IMPORTANT: Remplacer IP_DU_SERVEUR par l'adresse IP ou le hostname du serveur Lara

# Variable pour l'adresse du serveur (a modifier)
# Exemple: set $server_url "http://192.168.1.100:3000";
# Exemple: set $server_url "http://lara-server.mondomaine.com:3000";

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Configuration pour les fichiers statiques
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy pour les requetes API vers le serveur distant
    # MODIFIER L'ADRESSE IP CI-DESSOUS
    location /api/ {
        # ============================================
        # MODIFIER CETTE LIGNE AVEC L'IP DU SERVEUR
        # ============================================
        proxy_pass http://api.portail.lexamt.fr:8001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout pour les traductions longues
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Taille maximale des uploads
        client_max_body_size 50M;
    }

    # Health check endpoint (proxy vers le serveur)
    location /health {
        proxy_pass http://api.portail.lexamt.fr:8001/health;
        proxy_http_version 1.1;
    }

    # Cache pour les fichiers statiques
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
