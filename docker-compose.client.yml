# Docker Compose pour le CLIENT web (interface utilisateur)
# A deployer sur la machine cliente
#
# Usage:
#   1. Modifier SERVER_URL dans ce fichier avec l'IP du serveur
#   2. docker-compose -f docker-compose.client.yml up -d
#
# L'interface sera accessible sur http://localhost:8080

services:
  web-interface:
    image: nginx:alpine
    container_name: translation-web-interface
    ports:
      - "8080:80"
    volumes:
      # Fichiers de l'interface web
      - ./lexa_standalone.html:/usr/share/nginx/html/index.html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./doc:/usr/share/nginx/html/doc:ro
      # Configuration nginx
      - ./nginx.client.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      # IP ou hostname du serveur Lara (a modifier selon votre configuration)
      - SERVER_URL=http://IP_DU_SERVEUR:3000
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
