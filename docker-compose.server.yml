# Docker Compose pour le SERVEUR de traduction Lara
# A integrer sur la machine existante avec Django/Nginx
#
# Usage:
#   docker-compose -f docker-compose.server.yml up -d
#
# Le serveur sera accessible sur le port 3000 en interne
# Le nginx principal fera le proxy vers ce port

services:
  lara-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lara-translation-server
    ports:
      - "127.0.0.1:3000:3000"  # Expose uniquement en local
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/templates.xml:/app/templates.xml:ro
      - ./server/domaines.xml:/app/domaines.xml:ro
      - ./server/lara-glossaries.xml:/app/lara-glossaries.xml:ro
      - ./server/lara-memories.xml:/app/lara-memories.xml:ro
      - ./server/lara-resources.json:/app/lara-resources.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - lexamt-network

networks:
  lexamt-network:
    external: true
    name: lexamt-network  # Nom du reseau de votre stack Django (ajuster si different)
